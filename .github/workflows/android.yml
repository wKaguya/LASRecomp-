name: Android NDK - dependencias, compilacao e link

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Localizar o NDK
        shell: bash
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            NDK="$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/ndk/* | sort -V | tail -1)"
          fi
          echo "NDK=$NDK"
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          echo "TOOLBIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_ENV"
          echo "P=$GITHUB_WORKSPACE/deps-android" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Restaurar cache das dependencias
        uses: actions/cache/restore@v4
        with:
          path: deps-android
          key: android-deps-v2-${{ github.run_id }}
          restore-keys: android-deps-v2-

      - name: Compilar dependencias (SDL3, FFmpeg, Vulkan, VMA, shaderc)
        shell: bash
        run: |
          set -euo pipefail
          W=/tmp/depsbuild; S=/tmp/depssrc; LOGS="$PWD/deps-logs"
          mkdir -p "$P/include" "$P/lib" "$W" "$S" "$LOGS"
          JOBS=$(nproc)

          on_err() {
            {
              echo "## FALHA nas dependencias (linha $1)"
              echo "Comando: $2"
              echo '```'
              ls -la "$P/lib" 2>/dev/null || true
              L="$(ls -t "$LOGS"/*.log 2>/dev/null | head -n 1 || true)"
              if [ -n "$L" ]; then echo "--- $L"; tail -n 40 "$L"; fi
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          }
          trap 'on_err $LINENO "$BASH_COMMAND"' ERR

          fetch() { curl -fsSL -o "$S/$3" "$1"; echo "$2  $S/$3" | sha256sum -c --quiet; }
          unpack() { rm -rf "$W/$2"; mkdir -p "$W/$2"; tar -xf "$S/$1" -C "$W/$2" --strip-components 1; }

          if [ ! -f "$P/include/vma/vk_mem_alloc.h" ]; then
            echo ">>> cabecalhos Vulkan e VMA"
            fetch https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/vulkan-sdk-1.4.350.1.tar.gz \
                  6d1bb65e49520344cc0a48af3dc02e993781efff14c7ebdcb8ae9fa23ddf7e83 Vulkan-Headers-1.4.350.1.tar.gz
            fetch https://github.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator/archive/refs/tags/v3.3.0.tar.gz \
                  c4f6bbe6b5a45c2eb610ca9d231158e313086d5b1a40c9922cb42b597419b14e VulkanMemoryAllocator-3.3.0.tar.gz
            unpack Vulkan-Headers-1.4.350.1.tar.gz vulkan-headers
            cp -R "$W/vulkan-headers/include/vulkan" "$W/vulkan-headers/include/vk_video" "$P/include/"
            unpack VulkanMemoryAllocator-3.3.0.tar.gz vma
            mkdir -p "$P/include/vma"
            cp "$W/vma/include/vk_mem_alloc.h" "$P/include/vma/"
          fi

          if [ ! -f "$P/lib/libSDL3.so" ]; then
            echo ">>> SDL3"
            fetch https://github.com/libsdl-org/SDL/releases/download/release-3.4.16/SDL3-3.4.16.tar.gz \
                  7322236cd12090c3eb40b9728be4d49c76f66ad17d04369584d4ecad5cf77c68 SDL3-3.4.16.tar.gz
            unpack SDL3-3.4.16.tar.gz sdl
            cmake -S "$W/sdl" -B "$W/sdl/build" -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-33 \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$P" -DCMAKE_INSTALL_LIBDIR=lib \
              -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DSDL_ANDROID_JAR=OFF \
              > "$LOGS/sdl-configure.log" 2>&1
            cmake --build "$W/sdl/build" -j"$JOBS" > "$LOGS/sdl-build.log" 2>&1
            cmake --install "$W/sdl/build" > "$LOGS/sdl-install.log" 2>&1
            test -f "$P/lib/libSDL3.so"
          fi

          if [ ! -f "$P/lib/libavcodec.so" ]; then
            echo ">>> FFmpeg"
            fetch https://ffmpeg.org/releases/ffmpeg-9.0.2.tar.xz \
                  8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e ffmpeg-9.0.2.tar.xz
            unpack ffmpeg-9.0.2.tar.xz ffmpeg
            (
              cd "$W/ffmpeg"
              ./configure --prefix="$P" --enable-cross-compile --target-os=android --arch=aarch64 \
                --cc="$TOOLBIN/aarch64-linux-android33-clang" --cxx="$TOOLBIN/aarch64-linux-android33-clang++" \
                --ar="$TOOLBIN/llvm-ar" --nm="$TOOLBIN/llvm-nm" --ranlib="$TOOLBIN/llvm-ranlib" --strip="$TOOLBIN/llvm-strip" \
                --enable-shared --disable-static --enable-pic \
                --disable-autodetect --disable-programs --disable-doc --disable-network --disable-avdevice --disable-avfilter \
                --disable-swresample --disable-everything \
                --enable-protocol=file --enable-demuxer=matroska,mov \
                --enable-decoder=vp9,vp8,vorbis,opus,h264,aac --enable-parser=vp9,vp8,vorbis,opus,h264,aac \
                > "$LOGS/ffmpeg-configure.log" 2>&1
              make -j"$JOBS" > "$LOGS/ffmpeg-build.log" 2>&1
              make install > "$LOGS/ffmpeg-install.log" 2>&1
            )
            if grep -q 'define CONFIG_GPL 1' "$W/ffmpeg/config.h"; then echo "FFmpeg nao e LGPL"; false; fi
            ls -la "$P/lib" > "$LOGS/ffmpeg-libs.log"
            test -f "$P/lib/libavcodec.so"
          fi

          if [ ! -f "$P/lib/libshaderc_shared.so" ]; then
            echo ">>> shaderc (compilado do codigo-fonte)"
            fetch https://github.com/google/shaderc/archive/refs/tags/v2026.3.tar.gz \
                  ee493ccf1b3038b4ef2fe024664c5eb2dc4bcc1f6b05b33e3909de0e19c81024 shaderc-2026.3.tar.gz
            unpack shaderc-2026.3.tar.gz shaderc
            (cd "$W/shaderc" && python3 utils/git-sync-deps > "$LOGS/shaderc-sync.log" 2>&1)
            cmake -S "$W/shaderc" -B "$W/shaderc/build" -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-33 -DANDROID_STL=c++_static \
              -DCMAKE_BUILD_TYPE=Release -DSHADERC_SKIP_TESTS=ON -DSHADERC_SKIP_EXAMPLES=ON \
              -DSHADERC_SKIP_COPYRIGHT_CHECK=ON -DSPIRV_SKIP_TESTS=ON -DSPIRV_SKIP_EXECUTABLES=ON \
              -DENABLE_GLSLANG_BINARIES=OFF -DSPIRV_TOOLS_BUILD_STATIC=ON -DBUILD_SHARED_LIBS=OFF \
              > "$LOGS/shaderc-configure.log" 2>&1
            cmake --build "$W/shaderc/build" --target shaderc_shared -j"$JOBS" > "$LOGS/shaderc-build.log" 2>&1
            mkdir -p "$P/include/shaderc"
            cp "$W/shaderc/libshaderc/include/shaderc/"*.h "$P/include/shaderc/"
            cp -P "$W/shaderc/build/libshaderc/libshaderc_shared.so"* "$P/lib/"
            test -f "$P/lib/libshaderc_shared.so"
          fi

          echo "Dependencias prontas:"
          ls "$P/lib"

      - name: Salvar cache das dependencias
        if: always()
        uses: actions/cache/save@v4
        with:
          path: deps-android
          key: android-deps-v2-${{ github.run_id }}

      - name: Compilar e linkar libmain.so (Android arm64, API 33)
        shell: bash
        run: |
          set +e
          "$TOOLBIN/aarch64-linux-android33-clang" --version
          make -Otarget -k -j4 ARCH=aarch64 \
            CC="$TOOLBIN/aarch64-linux-android33-clang -fPIC" \
            CXX="$TOOLBIN/aarch64-linux-android33-clang++ -fPIC" \
            DEPINC="-I$P/include" \
            LDFLAGS="-shared -Wl,-soname,libmain.so -Wl,--no-undefined -fuse-ld=lld -L$P/lib -Wl,-rpath-link,$P/lib -lSDL3 -lavformat -lavcodec -lavutil -lswscale -lvulkan -lshaderc_shared -ldl -lm -llog" \
            build/aarch64/lasrecomp 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          LIB=apk-libs/arm64-v8a/libmain.so
          if [ "$rc" = "0" ] && [ -f build/aarch64/lasrecomp ]; then
            mkdir -p apk-libs/arm64-v8a
            cp build/aarch64/lasrecomp "$LIB"
          fi
          {
            echo "## Resultado: libmain.so (Android arm64, API 33)"
            echo "Codigo de saida do make: $rc"
            if [ -f "$LIB" ]; then
              echo "libmain.so gerado: SIM"
              ls -l "$LIB"
              echo "SDL_main exportado (1 = sim): $("$TOOLBIN/llvm-nm" -D --defined-only "$LIB" | grep -c ' T SDL_main$')"
              echo "Bibliotecas necessarias:"
              "$TOOLBIN/llvm-readelf" -d "$LIB" | grep NEEDED
            else
              echo "libmain.so gerado: NAO"
            fi
            echo
            echo "### Erros unicos"
            echo '```'
            grep -E 'error:|fatal error:|undefined symbol|undefined reference|relocation' build.log | sed -E 's#^[^ ]*/runtime/#runtime/#' | sort -u | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Montar o APK (Gradle)
        shell: bash
        run: |
          set +e
          APK=apk-out/LASRecomp-debug.apk
          bash tools/android/make_apk.sh apk-libs/arm64-v8a/libmain.so "$APK" 2>&1 | tee apk-build.log
          rc=${PIPESTATUS[0]}
          {
            echo "## Resultado: APK (Android arm64, API 33+)"
            echo "Codigo de saida: $rc"
            if [ -f "$APK" ]; then
              echo "APK gerado: SIM"
              ls -l "$APK"
              echo "Bibliotecas dentro do APK:"
              unzip -l "$APK" | grep 'lib/arm64-v8a' | awk '{print $1, $4}'
            else
              echo "APK gerado: NAO"
            fi
            echo
            echo "### Dependencias fora do APK"
            echo '```'
            sed -n '/Dependencias fora do APK/,/compilando o APK/p' apk-build.log | grep -v '^>>>'
            echo '```'
            if [ "$rc" != "0" ]; then
              echo "### Ultimas linhas do log"
              echo '```'
              tail -n 50 apk-build.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Publicar o APK
        uses: actions/upload-artifact@v4
        with:
          name: LASRecomp-debug-apk
          path: apk-out/LASRecomp-debug.apk
          if-no-files-found: error

      - name: Guardar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-logs
          path: |
            build.log
            deps-logs
            apk-libs
            apk-build.log
            apk-out/gradle.log
          if-no-files-found: ignore
