name: Android NDK - verificacao de compilacao

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  compile-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar cabecalhos (FFmpeg e VMA)
        run: |
          sudo apt-get update
          sudo apt-get install -y libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libvulkan-memory-allocator-dev

      - name: Montar pasta de cabecalhos (SDL3, FFmpeg, VMA, shaderc)
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "FALHOU no passo de cabecalhos, linha $LINENO" | tee -a "$GITHUB_STEP_SUMMARY"' ERR
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            NDK="$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/ndk/* | sort -V | tail -1)"
          fi
          echo "NDK=$NDK"
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          SYSINC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include"
          test -f "$SYSINC/vulkan/vulkan.h" || { echo "ERRO: vulkan.h nao encontrado no NDK"; exit 1; }

          INC="$PWD/deps/include"
          mkdir -p "$INC"

          git clone --depth 1 --branch release-3.4.18 https://github.com/libsdl-org/SDL.git /tmp/sdl
          cp -r /tmp/sdl/include/SDL3 "$INC/"

          for L in libavcodec libavformat libavutil libswscale; do
            D="$(find /usr/include -maxdepth 3 -type d -name "$L" -print -quit)"
            echo "$L em: $D"
            test -n "$D" || { echo "ERRO: cabecalhos de $L nao encontrados"; exit 1; }
            cp -r "$D" "$INC/"
          done
          find /usr/include -name avconfig.h -path '*libavutil*' -exec cp {} "$INC/libavutil/" \;

          VMA="$(find /usr/include -name vk_mem_alloc.h -print -quit)"
          echo "VMA=$VMA"
          test -n "$VMA" || { echo "ERRO: vk_mem_alloc.h nao encontrado"; exit 1; }
          cp "$VMA" "$INC/vk_mem_alloc.h"

          mkdir -p "$INC/shaderc"
          SC="$(find "$NDK" -path '*shaderc/shaderc.h' 2>/dev/null | head -1 || true)"
          if [ -n "$SC" ]; then
            echo "shaderc do NDK: $SC"
            cp "$(dirname "$SC")"/*.h "$INC/shaderc/"
          else
            echo "shaderc nao esta no NDK; usando os cabecalhos do GitHub"
            git clone --depth 1 https://github.com/google/shaderc.git /tmp/shaderc
            cp /tmp/shaderc/libshaderc/include/shaderc/*.h "$INC/shaderc/"
          fi
          ls "$INC"

      - name: Compilar o runtime para Android arm64 (API 33)
        shell: bash
        run: |
          set +e
          TOOLBIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$TOOLBIN/aarch64-linux-android33-clang" --version
          make -k -j4 ARCH=aarch64 \
            CC="$TOOLBIN/aarch64-linux-android33-clang" \
            CXX="$TOOLBIN/aarch64-linux-android33-clang++" \
            DEPINC="-I$PWD/deps/include" \
            runtime-objs 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          {
            echo "## Resultado da compilacao do runtime (Android arm64, API 33)"
            echo "Codigo de saida do make: $rc"
            echo
            echo "### Erros unicos"
            echo '```'
            grep -E 'error:|fatal error:|undefined' build.log | sed -E 's#^[^ ]*/runtime/#runtime/#' | sort -u | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Guardar o log completo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-compile-log
          path: build.log
          if-no-files-found: ignore
